<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BoyCash</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        overflow: hidden;
      }
      #root {
        width: 142.85%;
        height: 142.85%;
        transform: scale(0.7);
        transform-origin: top left;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        will-change: transform;
        backface-visibility: hidden;
        perspective: 1000px;
      }
      #native-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
      }
      #native-splash iframe {
        width: 100%;
        height: 100%;
        border: none;
        position: absolute;
        inset: 0;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DORwXVeL.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bv4flOlE.css">
  </head>
  <body>
    <div id="native-splash">
      <iframe src="/splash.html"></iframe>
    </div>
    <div id="root"></div>
    <script>
      setTimeout(function() {
        var s = document.getElementById('native-splash');
        if (s) {
          s.style.opacity = '0';
          setTimeout(function() { s.remove(); }, 500);
        }
      }, 3500);
    </script>
  </body>
</html>
